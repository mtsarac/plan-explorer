services:
  webapp:
    build: .
    ports:
      - 3000:3000
  db:
    image: postgres:17
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-PlaygroundDb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
